<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dgraph Query Debug Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .scrollable { scrollbar-width: thin; scrollbar-color: #4b5563 #1f2937; }
    .scrollable::-webkit-scrollbar { width: 6px; }
    .scrollable::-webkit-scrollbar-track { background: #1f2937; }
    .scrollable::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    .sort-asc::after { content: ' ▲'; font-size: 0.65em; }
    .sort-desc::after { content: ' ▼'; font-size: 0.65em; }
    pre.query-text { white-space: pre-wrap; word-break: break-word; }
    /* context menu */
    .ctx-menu { position: fixed; z-index: 50; }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="flex items-center justify-between px-5 py-3 bg-gray-900 border-b border-gray-800 shrink-0">
    <h1 class="text-lg font-semibold tracking-tight text-white">Dgraph Query Debug</h1>
    <div class="flex items-center gap-3 flex-wrap">
      <label class="text-xs text-gray-400">Alpha</label>
      <input id="alphaUrl" type="text" value="http://localhost:8080"
        class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm w-56 focus:outline-none focus:border-blue-500" />
      
      <label class="text-xs text-gray-400">Time Range</label>
      <select id="timeRange" onchange="onTimeRangeChange()"
        class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 text-gray-200">
        <option value="all">All Time</option>
        <option value="1m">Last Minute</option>
        <option value="5m">Last 5 Minutes</option>
        <option value="15m">Last 15 Minutes</option>
        <option value="1h">Last Hour</option>
        <option value="24h">Last 24 Hours</option>
        <option value="custom">Custom Range</option>
      </select>

      <div id="customRangeInputs" class="hidden flex items-center gap-2">
        <input id="customStart" type="datetime-local"
          class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 text-gray-200" />
        <span class="text-xs text-gray-500">to</span>
        <input id="customEnd" type="datetime-local"
          class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 text-gray-200" />
      </div>

      <div id="limitContainer" class="flex items-center gap-2">
        <label class="text-xs text-gray-400">Limit</label>
        <input id="queryLimit" type="number" value="200" min="1" max="10000"
          class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm w-20 focus:outline-none focus:border-blue-500" />
      </div>

      <button onclick="fetchDebugEntries()"
        class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-1.5 rounded transition">
        Fetch
      </button>
      <button onclick="clearAllDebugHistory()"
        class="bg-red-700 hover:bg-red-600 text-white text-sm font-medium px-4 py-1.5 rounded transition">
        Clear All
      </button>
      <span id="statusBadge" class="text-xs text-gray-500"></span>
    </div>
  </header>

  <!-- Main two-column layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left panel: list -->
    <div class="w-[55%] flex flex-col border-r border-gray-800 overflow-hidden">
      <!-- Filter bar -->
      <div class="px-3 py-2 bg-gray-900 border-b border-gray-800 flex items-center gap-2 shrink-0 flex-wrap">
        <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="filterInput" type="text" placeholder="Filter: allAcls AND uid(1), &quot;exact phrase&quot;, NOT schema, (a OR b) AND c"
          class="flex-1 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 min-w-[120px]"
          oninput="applyFilter()" />
        <label class="flex items-center gap-1 text-xs text-gray-400 cursor-pointer select-none">
          <input type="checkbox" id="filterExclude" onchange="applyFilter()" class="rounded" />
          Exclude
        </label>
        <div class="border-l border-gray-700 h-4 mx-1"></div>
        <label class="flex items-center gap-1 text-xs text-gray-400 cursor-pointer select-none">
          <input type="checkbox" id="groupToggle" onchange="applyFilter()" class="rounded" />
          Group
        </label>
        <span id="countBadge" class="text-xs text-gray-500 ml-1"></span>
      </div>

      <!-- Hidden queries chips -->
      <div id="hiddenBar" class="hidden px-3 py-1.5 bg-gray-900/80 border-b border-gray-800 flex items-center gap-1.5 flex-wrap shrink-0">
        <span class="text-xs text-gray-500 mr-1">Hidden:</span>
      </div>

      <!-- Table header -->
      <div id="tableHeader" class="text-xs font-medium text-gray-400 uppercase tracking-wider px-3 py-1.5 bg-gray-900 border-b border-gray-800 shrink-0 select-none"></div>

      <!-- Rows -->
      <div id="entryList" class="flex-1 overflow-y-auto scrollable"></div>
    </div>

    <!-- Right panel: detail -->
    <div id="detailPanel" class="w-[45%] overflow-y-auto scrollable p-5">
      <div class="text-gray-500 text-sm italic">Select a query from the list to view details.</div>
    </div>
  </div>

  <!-- Context menu (hidden) -->
  <div id="ctxMenu" class="ctx-menu hidden bg-gray-800 border border-gray-700 rounded shadow-xl py-1 min-w-[180px]"></div>

  <script>
    // ── State ──────────────────────────────────────────────
    let allEntries = [];
    let displayRows = [];  // after filter/group/sort — either entries or groups
    let selectedUid = null;
    let selectedGroupKey = null;
    let sortField = 'total';
    let sortDir = 'desc';
    let hiddenQueries = new Set();  // normalized query strings to hide

    // ── Time range change event handler ───────────────────
    function onTimeRangeChange() {
      const val = document.getElementById('timeRange').value;
      const customDiv = document.getElementById('customRangeInputs');
      const limitDiv = document.getElementById('limitContainer');

      if (val === 'custom') {
        customDiv.classList.remove('hidden');
        const now = new Date();
        const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
        const formatLocal = (d) => {
          const pad = (n) => String(n).padStart(2, '0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };
        if (!document.getElementById('customStart').value) {
          document.getElementById('customStart').value = formatLocal(oneHourAgo);
        }
        if (!document.getElementById('customEnd').value) {
          document.getElementById('customEnd').value = formatLocal(now);
        }
      } else {
        customDiv.classList.add('hidden');
      }

      if (val === 'all') {
        limitDiv.classList.remove('hidden');
      } else {
        limitDiv.classList.add('hidden');
      }
    }

    // ── Fetch ─────────────────────────────────────────────
    async function fetchDebugEntries() {
      const url = document.getElementById('alphaUrl').value.replace(/\/+$/, '');
      const badge = document.getElementById('statusBadge');
      badge.textContent = 'Loading…';
      badge.className = 'text-xs text-yellow-400';

      const timeRange = document.getElementById('timeRange').value;
      let filter = '';
      let firstClause = '';

      if (timeRange === 'all') {
        const limit = document.getElementById('queryLimit').value || 200;
        firstClause = `, first: ${limit}`;
      } else if (timeRange === 'custom') {
        const startVal = document.getElementById('customStart').value;
        const endVal = document.getElementById('customEnd').value;
        if (startVal && endVal) {
          const startIso = new Date(startVal).toISOString();
          const endIso = new Date(endVal).toISOString();
          filter = `@filter(ge(dgraph.debug.timestamp, "${startIso}") AND le(dgraph.debug.timestamp, "${endIso}"))`;
        } else if (startVal) {
          const startIso = new Date(startVal).toISOString();
          filter = `@filter(ge(dgraph.debug.timestamp, "${startIso}"))`;
        } else if (endVal) {
          const endIso = new Date(endVal).toISOString();
          filter = `@filter(le(dgraph.debug.timestamp, "${endIso}"))`;
        }
      } else {
        let ms = 0;
        switch (timeRange) {
          case '1m':  ms = 1 * 60 * 1000; break;
          case '5m':  ms = 5 * 60 * 1000; break;
          case '15m': ms = 15 * 60 * 1000; break;
          case '1h':  ms = 1 * 60 * 60 * 1000; break;
          case '24h': ms = 24 * 60 * 60 * 1000; break;
        }
        const cutOff = new Date(Date.now() - ms).toISOString();
        filter = `@filter(ge(dgraph.debug.timestamp, "${cutOff}"))`;
      }

      const dql = `{
        ops(func: type(dgraph.debug.Operation), orderdesc: dgraph.debug.timestamp${firstClause}) ${filter} {
          uid
          dgraph.debug.query
          dgraph.debug.mutation
          dgraph.debug.variables
          dgraph.debug.operation
          dgraph.debug.timestamp
          dgraph.debug.latency_total_ns
          dgraph.debug.latency_parsing_ns
          dgraph.debug.latency_processing_ns
          dgraph.debug.latency_encoding_ns
          dgraph.debug.latency_assign_ts_ns
          dgraph.debug.uids_total
          dgraph.debug.uid_metrics
          dgraph.debug.disk_reads
          dgraph.debug.cache_hits
          dgraph.debug.cache_misses
          dgraph.debug.error
          dgraph.debug.namespace
          dgraph.debug.trace_id
        }
      }`;

      try {
        const resp = await fetch(url + '/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/dql' },
          body: dql,
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        allEntries = (json.data?.ops || []).map(normalizeEntry);
        badge.textContent = `${allEntries.length} entries`;
        badge.className = 'text-xs text-green-400';
        selectedUid = null;
        selectedGroupKey = null;
        applyFilter();
      } catch (e) {
        badge.textContent = e.message;
        badge.className = 'text-xs text-red-400';
      }
    }

    async function clearAllDebugHistory() {
      if (!confirm('Delete all debug history entries? This cannot be undone.')) return;
      const url = document.getElementById('alphaUrl').value.replace(/\/+$/, '');
      const badge = document.getElementById('statusBadge');
      badge.textContent = 'Clearing…';
      badge.className = 'text-xs text-yellow-400';

      try {
        // Query all debug entry UIDs
        const findResp = await fetch(url + '/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/dql' },
          body: '{ ops(func: type(dgraph.debug.Operation)) { uid } }',
        });
        if (!findResp.ok) throw new Error(`Query failed: HTTP ${findResp.status}`);
        const findJson = await findResp.json();
        const uids = (findJson.data?.ops || []).map(n => n.uid);

        if (uids.length === 0) {
          badge.textContent = 'Nothing to clear';
          badge.className = 'text-xs text-gray-400';
          return;
        }

        // Delete all nodes by UID using JSON mutation
        const delBody = uids.map(uid => ({ uid }));
        const mutResp = await fetch(url + '/mutate?commitNow=true', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ delete: delBody }),
        });
        if (!mutResp.ok) throw new Error(`Mutate failed: HTTP ${mutResp.status}`);

        allEntries = [];
        selectedUid = null;
        selectedGroupKey = null;
        applyFilter();
        document.getElementById('detailPanel').innerHTML =
          '<div class="text-gray-500 text-sm italic">Select a query from the list to view details.</div>';
        badge.textContent = `Cleared ${uids.length} entries`;
        badge.className = 'text-xs text-green-400';
      } catch (e) {
        badge.textContent = e.message;
        badge.className = 'text-xs text-red-400';
      }
    }

    function normalizeEntry(e) {
      return {
        uid:        e.uid,
        query:      e['dgraph.debug.query'] || '',
        mutation:   e['dgraph.debug.mutation'] || '',
        variables:  e['dgraph.debug.variables'] || '',
        operation:  e['dgraph.debug.operation'] || '',
        timestamp:  e['dgraph.debug.timestamp'] || '',
        total:      e['dgraph.debug.latency_total_ns'] || 0,
        parsing:    e['dgraph.debug.latency_parsing_ns'] || 0,
        processing: e['dgraph.debug.latency_processing_ns'] || 0,
        encoding:   e['dgraph.debug.latency_encoding_ns'] || 0,
        assignTs:   e['dgraph.debug.latency_assign_ts_ns'] || 0,
        uids:       e['dgraph.debug.uids_total'] || 0,
        uidMetrics: e['dgraph.debug.uid_metrics'] || '',
        diskReads:  e['dgraph.debug.disk_reads'] || 0,
        cacheHits:  e['dgraph.debug.cache_hits'] || 0,
        cacheMisses:e['dgraph.debug.cache_misses'] || 0,
        get cacheRate() {
          const t = this.cacheHits + this.cacheMisses;
          return t > 0 ? (this.cacheHits / t) * 100 : -1; // -1 = no data
        },
        error:      e['dgraph.debug.error'] || '',
        namespace:  e['dgraph.debug.namespace'] || 0,
        traceId:    e['dgraph.debug.trace_id'] || '',
      };
    }

    // ── Normalize query for grouping (strip whitespace) ───
    function queryKey(q) { return q.replace(/\s+/g, ' ').trim(); }

    // ── Boolean filter expression parser ──────────────────
    // Supports: AND, OR, NOT, parentheses, "quoted phrases", bare terms.
    // Examples:
    //   allAcls AND uid(1)
    //   "func: eq" OR mutation
    //   NOT uid(1)
    //   (allAcls OR schema) AND NOT uid(1)
    // Bare terms without operators are implicitly ANDed.

    function parseFilterExpr(input) {
      const tokens = tokenizeFilter(input);
      if (tokens.length === 0) return null;
      const ctx = { tokens, pos: 0 };
      const expr = parseOr(ctx);
      return expr;
    }

    function tokenizeFilter(input) {
      const tokens = [];
      let i = 0;
      while (i < input.length) {
        if (input[i] === ' ' || input[i] === '\t') { i++; continue; }
        if (input[i] === '(') { tokens.push({ type: 'LPAREN' }); i++; continue; }
        if (input[i] === ')') { tokens.push({ type: 'RPAREN' }); i++; continue; }
        if (input[i] === '"') {
          const end = input.indexOf('"', i + 1);
          const str = end === -1 ? input.slice(i + 1) : input.slice(i + 1, end);
          tokens.push({ type: 'TERM', value: str.toLowerCase() });
          i = end === -1 ? input.length : end + 1;
          continue;
        }
        // Read a word
        let j = i;
        while (j < input.length && !' \t()\"'.includes(input[j])) j++;
        const word = input.slice(i, j);
        const upper = word.toUpperCase();
        if (upper === 'AND') tokens.push({ type: 'AND' });
        else if (upper === 'OR') tokens.push({ type: 'OR' });
        else if (upper === 'NOT') tokens.push({ type: 'NOT' });
        else tokens.push({ type: 'TERM', value: word.toLowerCase() });
        i = j;
      }
      return tokens;
    }

    function peek(ctx) { return ctx.pos < ctx.tokens.length ? ctx.tokens[ctx.pos] : null; }
    function consume(ctx) { return ctx.tokens[ctx.pos++]; }

    // Grammar: or = and (OR and)*
    function parseOr(ctx) {
      let left = parseAnd(ctx);
      while (peek(ctx)?.type === 'OR') {
        consume(ctx);
        const right = parseAnd(ctx);
        left = { op: 'OR', left, right };
      }
      return left;
    }

    // Grammar: and = unary ((AND)? unary)*
    // Implicit AND: two terms without an operator
    function parseAnd(ctx) {
      let left = parseUnary(ctx);
      while (peek(ctx) && peek(ctx).type !== 'OR' && peek(ctx).type !== 'RPAREN') {
        if (peek(ctx).type === 'AND') consume(ctx);
        const right = parseUnary(ctx);
        left = { op: 'AND', left, right };
      }
      return left;
    }

    // Grammar: unary = NOT unary | atom
    function parseUnary(ctx) {
      if (peek(ctx)?.type === 'NOT') {
        consume(ctx);
        return { op: 'NOT', child: parseUnary(ctx) };
      }
      return parseAtom(ctx);
    }

    // Grammar: atom = LPAREN or RPAREN | TERM
    function parseAtom(ctx) {
      if (peek(ctx)?.type === 'LPAREN') {
        consume(ctx);
        const expr = parseOr(ctx);
        if (peek(ctx)?.type === 'RPAREN') consume(ctx);
        return expr;
      }
      const tok = consume(ctx);
      if (tok?.type === 'TERM') return { op: 'TERM', value: tok.value };
      return { op: 'TERM', value: '' }; // fallback
    }

    function evalFilter(expr, text) {
      if (!expr) return true;
      switch (expr.op) {
        case 'TERM':  return text.includes(expr.value);
        case 'AND':   return evalFilter(expr.left, text) && evalFilter(expr.right, text);
        case 'OR':    return evalFilter(expr.left, text) || evalFilter(expr.right, text);
        case 'NOT':   return !evalFilter(expr.child, text);
        default:      return true;
      }
    }

    // ── Filter + Group + Sort pipeline ────────────────────
    function applyFilter() {
      const raw = document.getElementById('filterInput').value.trim();
      const exclude = document.getElementById('filterExclude').checked;
      const grouped = document.getElementById('groupToggle').checked;

      // 1. Filter by expression
      let entries = allEntries;
      const expr = parseFilterExpr(raw);
      if (expr) {
        entries = entries.filter(e => {
          const match = evalFilter(expr, e.query.toLowerCase());
          return exclude ? !match : match;
        });
      }

      // 2. Remove hidden queries
      if (hiddenQueries.size > 0) {
        entries = entries.filter(e => !hiddenQueries.has(queryKey(e.query)));
      }

      // 3. Group or flat
      if (grouped) {
        displayRows = buildGroups(entries);
      } else {
        displayRows = entries.map(e => ({ type: 'entry', data: e }));
      }

      // 4. Sort
      sortDisplayRows();

      // 5. Render
      renderHeader(grouped);
      renderList(grouped);
      renderHiddenBar();

      const totalAfterHidden = allEntries.length - [...hiddenQueries].reduce((n, hq) =>
        n + allEntries.filter(e => queryKey(e.query) === hq).length, 0);
      const shown = entries.length;
      document.getElementById('countBadge').textContent =
        shown < allEntries.length ? `${grouped ? displayRows.length + ' groups' : shown} / ${allEntries.length}` : '';
    }

    function buildGroups(entries) {
      const map = new Map();
      for (const e of entries) {
        const key = queryKey(e.query);
        if (!map.has(key)) {
          map.set(key, { type: 'group', key, query: e.query, operation: e.operation, entries: [] });
        }
        map.get(key).entries.push(e);
      }
      // Compute aggregate stats
      for (const g of map.values()) {
        const n = g.entries.length;
        g.count = n;
        g.timestamp = g.entries.reduce((latest, e) => e.timestamp > latest ? e.timestamp : latest, '');
        g.total    = Math.max(...g.entries.map(e => e.total));
        g.avgTotal = g.entries.reduce((s, e) => s + e.total, 0) / n;
        g.uids     = Math.max(...g.entries.map(e => e.uids));
        g.diskReads  = g.entries.reduce((s, e) => s + e.diskReads, 0);
        g.cacheHits  = g.entries.reduce((s, e) => s + e.cacheHits, 0);
        g.cacheMisses = g.entries.reduce((s, e) => s + e.cacheMisses, 0);
        const totalLookups = g.cacheHits + g.cacheMisses;
        g.cacheRate = totalLookups > 0 ? (g.cacheHits / totalLookups) * 100 : -1;
      }
      return [...map.values()];
    }

    // ── Sort ──────────────────────────────────────────────
    function toggleSort(field) {
      if (sortField === field) {
        sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      } else {
        sortField = field;
        sortDir = 'desc';
      }
      sortDisplayRows();
      const grouped = document.getElementById('groupToggle').checked;
      renderList(grouped);
      updateSortIndicators();
    }

    function sortDisplayRows() {
      const dir = sortDir === 'asc' ? 1 : -1;
      const field = sortField;
      displayRows.sort((a, b) => {
        const ae = a.type === 'group' ? a : a.data;
        const be = b.type === 'group' ? b : b.data;
        const av = ae[field], bv = be[field];
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
        return String(av ?? '').localeCompare(String(bv ?? '')) * dir;
      });
    }

    function updateSortIndicators() {
      for (const f of ['query','operation','timestamp','total','uids','diskReads','cacheRate','count']) {
        const el = document.getElementById('sort-' + f);
        if (el) el.className = sortField === f ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : '';
      }
    }

    // ── Render table header ───────────────────────────────
    function renderHeader(grouped) {
      const hdr = document.getElementById('tableHeader');
      if (grouped) {
        hdr.innerHTML = `<div class="grid grid-cols-[1fr_60px_80px_130px_90px_90px_70px_70px]">
          <div class="cursor-pointer hover:text-white" onclick="toggleSort('query')">Query<span id="sort-query"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('count')">#<span id="sort-count"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('operation')">Op<span id="sort-operation"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('timestamp')">Time<span id="sort-timestamp"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('total')">Max Time<span id="sort-total"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('uids')">Max UIDs<span id="sort-uids"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('diskReads')">Disk<span id="sort-diskReads"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('cacheRate')">Cache %<span id="sort-cacheRate"></span></div>
        </div>`;
      } else {
        hdr.innerHTML = `<div class="grid grid-cols-[1fr_100px_130px_90px_90px_70px_70px]">
          <div class="cursor-pointer hover:text-white" onclick="toggleSort('query')">Query<span id="sort-query"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('operation')">Op<span id="sort-operation"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('timestamp')">Time<span id="sort-timestamp"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('total')">Total<span id="sort-total"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('uids')">UIDs<span id="sort-uids"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('diskReads')">Disk<span id="sort-diskReads"></span></div>
          <div class="cursor-pointer hover:text-white text-right" onclick="toggleSort('cacheRate')">Cache %<span id="sort-cacheRate"></span></div>
        </div>`;
      }
      updateSortIndicators();
    }

    // ── Render list ───────────────────────────────────────
    function renderList(grouped) {
      const container = document.getElementById('entryList');
      if (displayRows.length === 0) {
        container.innerHTML = '<div class="text-gray-500 text-sm p-4 italic">No entries found.</div>';
        return;
      }

      const html = displayRows.map((row, idx) => {
        if (row.type === 'group') return renderGroupRow(row, idx);
        return renderEntryRow(row.data, idx);
      }).join('');

      container.innerHTML = html;
    }

    function renderEntryRow(e, idx) {

    async function copyForAI(uid) {
      const e = allEntries.find(x => x.uid === uid);
      if (!e) return;

      const btn = event.target.closest('button');
      const orig = btn.innerHTML;
      btn.innerHTML = '<svg class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Fetching…';
      btn.disabled = true;

      try {
        const [schemaText, typeCountsText] = await Promise.all([
          fetchSchemaForAI(),
          fetchTypeCountsForAI(),
        ]);

        const text = buildAIPrompt(e, schemaText, typeCountsText);
        await navigator.clipboard.writeText(text.trim());

        btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copied!';
        btn.classList.add('text-green-400', 'border-green-700');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('text-green-400', 'border-green-700'); btn.disabled = false; }, 1500);
      } catch (err) {
        btn.innerHTML = 'Error';
        btn.classList.add('text-red-400', 'border-red-700');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('text-red-400', 'border-red-700'); btn.disabled = false; }, 2000);
        console.error('copyForAI failed:', err);
      }

    async function fetchSchemaForAI() {
      const url = document.getElementById('alphaUrl').value.replace(/\/+$/, '');
      const resp = await fetch(url + '/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/dql' },
        body: 'schema {}',
      });
      const json = await resp.json();
      const preds = json.data?.schema || [];
      if (preds.length === 0) return '(no schema found)';

      // Format as DQL-style schema lines, skip dgraph.debug.* predicates
      const lines = preds
        .filter(p => !p.predicate.startsWith('dgraph.debug.'))
        .sort((a, b) => a.predicate.localeCompare(b.predicate))
        .map(p => {
          let line = `${p.predicate}: ${p.type}`;
          const directives = [];
          if (p.list) line = `[${line}]`;
          if (p.index && p.tokenizer) directives.push(`@index(${p.tokenizer.join(', ')})`);
          if (p.reverse) directives.push('@reverse');
          if (p.count) directives.push('@count');
          if (p.upsert) directives.push('@upsert');
          if (p.unique) directives.push('@unique');
          if (p.lang) directives.push('@lang');
          if (directives.length) line += ' ' + directives.join(' ');
          return line + ' .';
        });
      return lines.join('\n');
    }

    async function fetchTypeCountsForAI() {
      const url = document.getElementById('alphaUrl').value.replace(/\/+$/, '');

      // First get all type names
      const typesResp = await fetch(url + '/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/dql' },
        body: 'schema { type }',
      });
      const typesJson = await typesResp.json();
      const types = (typesJson.data?.types || [])
        .map(t => t.name)
        .filter(n => !n.startsWith('dgraph.debug.'));

      if (types.length === 0) return '(no types found)';

      // Batch count queries, 50 types per request
      const batchSize = 50;
      const counts = {};
      for (let i = 0; i < types.length; i += batchSize) {
        const batch = types.slice(i, i + batchSize);
        // Sanitize type names for use as DQL aliases (replace non-alphanumeric with _)
        const blocks = batch.map((t, j) => {
          const alias = 'T' + (i + j);
          return `${alias}(func: type(${t})) { count(uid) }`;
        });
        const dql = '{ ' + blocks.join('\n') + ' }';

        const resp = await fetch(url + '/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/dql' },
          body: dql,
        });
        const json = await resp.json();
        if (json.data) {
          batch.forEach((t, j) => {
            const alias = 'T' + (i + j);
            const result = json.data[alias];
            counts[t] = result?.[0]?.count ?? 0;
          });
        }
      }

      // Format as table, sorted by count descending, skip zeros
      const rows = Object.entries(counts)
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `  ${k.padEnd(45)} ${v.toLocaleString()}`);

      if (rows.length === 0) return '(all types have 0 nodes)';

      const zeroCount = Object.values(counts).filter(v => v === 0).length;
      let result = rows.join('\n');
      if (zeroCount > 0) {
        result += `\n  ... and ${zeroCount} types with 0 nodes`;
      }
      return result;
    }

    function buildAIPrompt(e, schemaText, typeCountsText) {
      let uidMetricsTable = '';
      if (e.uidMetrics) {
        try {
          const m = JSON.parse(e.uidMetrics);
          const rows = Object.entries(m)
            .filter(([k]) => k !== '_total')
            .sort((a, b) => b[1] - a[1])
            .map(([k, v]) => `  ${(k || '(root)').padEnd(40)} ${v}`);
          uidMetricsTable = rows.join('\n');
        } catch { uidMetricsTable = e.uidMetrics; }
      }

      return `I have a Dgraph DQL ${e.operation} that I'd like help optimizing. Below are the query details, performance metrics, the database schema, and node counts by type — all captured from a live system.

## DQL ${e.operation.charAt(0).toUpperCase() + e.operation.slice(1)}

\`\`\`dql
${e.query || '(no query text)'}
\`\`\`
${e.mutation ? `
## Mutation Body

\`\`\`
${e.mutation}
\`\`\`
` : ''}${e.variables ? `
## Variables

\`\`\`json
${(() => { try { return JSON.stringify(JSON.parse(e.variables), null, 2); } catch { return e.variables; } })()}
\`\`\`
` : ''}
## Performance Metrics

| Metric | Value |
|--------|-------|
| Total Latency | ${fmtDuration(e.total)} |
| Processing | ${fmtDuration(e.processing)} |
| Encoding | ${fmtDuration(e.encoding)} |
| Parsing | ${fmtDuration(e.parsing)} |
| Assign Timestamp | ${fmtDuration(e.assignTs)} |
| UIDs Visited | ${e.uids.toLocaleString()} |
| Disk Reads | ${e.diskReads.toLocaleString()} |
| Cache Hits | ${e.cacheHits.toLocaleString()} |
| Cache Misses | ${e.cacheMisses.toLocaleString()} |
| Cache Hit Rate | ${e.cacheRate >= 0 ? e.cacheRate.toFixed(1) + '%' : 'N/A'} |
${e.error ? `| Error | ${e.error} |\n` : ''}${uidMetricsTable ? `
## UIDs Visited by Predicate

\`\`\`
${uidMetricsTable}
\`\`\`
` : ''}
## Database Schema

\`\`\`dql
${schemaText}
\`\`\`

## Node Counts by Type

\`\`\`
${typeCountsText}
\`\`\`

## Goals

Please analyze this ${e.operation} and suggest optimizations to reduce latency and resource usage. Consider:
- Query structure and whether predicates can be reduced or reordered
- Index usage and whether additional or different indexes would help (refer to the schema above)
- Filter placement (pushing filters closer to the root to reduce fan-out)
- Whether the query visits too many UIDs relative to the data size (refer to type counts above)
- Caching effectiveness (${e.cacheRate >= 0 ? e.cacheRate.toFixed(0) + '% hit rate' : 'no cache data'})
- Any anti-patterns in the DQL
`;
    }

    function percentile(arr, p) {
      const sorted = [...arr].sort((a, b) => a - b);
      const idx = Math.ceil((p / 100) * sorted.length) - 1;
      return sorted[Math.max(0, idx)];
    }

    // ── Helpers ────────────────────────────────────────────
    function fmtDuration(ns) {
      if (ns >= 1e9) return (ns / 1e9).toFixed(2) + 's';
      if (ns >= 1e6) return (ns / 1e6).toFixed(2) + 'ms';
      if (ns >= 1e3) return (ns / 1e3).toFixed(1) + 'µs';
      return ns + 'ns';
    }

    function fmtNum(n) {
      if (n === 0) return '0';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return String(n);
    }

    function fmtTimestamp(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleString(); } catch { return ts; }
    }

    function fmtShortTime(ts) {
      if (!ts) return '';
      try {
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch { return ts; }
    }

    function fmtJson(s) {
      try { return esc(JSON.stringify(JSON.parse(s), null, 2)); } catch { return esc(s); }
    }

    function latencyColor(ns) {
      if (ns >= 1e9) return 'text-red-400';
      if (ns >= 100e6) return 'text-orange-400';
      if (ns >= 10e6) return 'text-yellow-400';
      return 'text-green-400';
    }

    function fmtCacheRate(rate) {
      if (rate < 0) return '-';
      return rate.toFixed(0) + '%';
    }

    function cacheRateColor(rate) {
      if (rate < 0) return 'text-gray-600';
      if (rate >= 80) return 'text-green-400';
      if (rate >= 50) return 'text-yellow-400';
      if (rate >= 20) return 'text-orange-400';
      return 'text-red-400';
    }

    function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function statRow(label, value, valueClass) {
      return `<div class="text-gray-400">${label}</div><div class="text-right font-mono ${valueClass || 'text-gray-200'}">${value}</div>`;
    }

    function latencyBar(e) {
      const total = e.total || 1;
      const segs = [
        { label: 'Parsing',    ns: e.parsing,    color: 'bg-blue-500' },
        { label: 'Assign TS',  ns: e.assignTs,   color: 'bg-purple-500' },
        { label: 'Processing', ns: e.processing,  color: 'bg-emerald-500' },
        { label: 'Encoding',   ns: e.encoding,   color: 'bg-amber-500' },
      ];
      const accounted = segs.reduce((s, x) => s + x.ns, 0);
      if (accounted < total) {
        segs.push({ label: 'Other', ns: total - accounted, color: 'bg-gray-600' });
      }
      const bars = segs
        .filter(s => s.ns > 0)
        .map(s => {
          const pct = Math.max((s.ns / total) * 100, 0.5);
          return `<div class="${s.color} h-full rounded-sm" style="width:${pct}%" title="${s.label}: ${fmtDuration(s.ns)}"></div>`;
        }).join('');
      return `<div class="flex h-3 rounded overflow-hidden gap-px bg-gray-800">${bars}</div>
        <div class="flex gap-3 mt-1.5 text-xs text-gray-500">
          ${segs.filter(s => s.ns > 0).map(s => `<span class="flex items-center gap-1"><span class="inline-block w-2 h-2 rounded-sm ${s.color}"></span>${s.label}</span>`).join('')}
        </div>`;
    }

    function renderUidMetrics(jsonStr) {
      try {
        const m = JSON.parse(jsonStr);
        const entries = Object.entries(m)
          .filter(([k]) => k !== '_total')
          .sort((a, b) => b[1] - a[1]);
        if (entries.length === 0) return '<div class="text-gray-500 text-sm">No per-predicate metrics.</div>';
        return `<table class="w-full text-sm">
          <thead><tr class="text-xs text-gray-500 uppercase"><th class="text-left pb-1">Predicate</th><th class="text-right pb-1">UIDs</th></tr></thead>
          <tbody>${entries.map(([k, v]) => {
            const name = k || '(root)';
            const cls = k ? 'text-gray-300' : 'text-gray-500 italic';
            return `<tr class="border-t border-gray-800/50"><td class="font-mono ${cls} py-0.5">${esc(name)}</td><td class="text-right font-mono text-gray-400">${fmtNum(v)}</td></tr>`;
          }).join('')}</tbody>
        </table>`;
      } catch {
        return `<pre class="text-xs text-gray-400">${esc(jsonStr)}</pre>`;
      }
    }

    // ── Keyboard shortcuts ────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeCtxMenu();
        document.getElementById('filterInput').value = '';
        applyFilter();
      }
    });

    // Init
    renderHeader(false);
    updateSortIndicators();
    onTimeRangeChange();
  </script>
</body>
</html>
